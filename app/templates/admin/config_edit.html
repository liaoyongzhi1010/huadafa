{% extends "admin/base.html" %}
{% block title %}验证页配置{% endblock %}
{% block topbar_title %}验证页配置{% endblock %}
{% block body %}
  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">验证页配置</h1>
        <div class="muted page-subtitle">控制验证页文案、显隐、防伪码查询阈值等</div>
      </div>
    </div>

    <div class="card">
      <form class="form" method="post" action="/admin/config">
        <label style="display:flex; align-items:center; gap:10px;">
          <input type="checkbox" name="show_code" {% if cfg.show_code %}checked{% endif %} />
          <span style="font-weight:800;">显示防伪码</span>
        </label>

        <div class="form-row">
          <div class="label">警示阈值（次数）</div>
          <input class="input" name="warning_threshold" value="{{ cfg.warning_threshold }}" />
        </div>
        <div class="form-row">
          <div class="label">展示最近验证条数</div>
          <input class="input" name="recent_events_limit" value="{{ cfg.recent_events_limit }}" />
        </div>
        <div class="form-row">
          <div class="label">联系我们跳转 URL</div>
          <input class="input" name="contact_us_url" value="{{ cfg.contact_us_url }}" placeholder="https://1918imco.com/..." />
        </div>
        <div class="form-row">
          <div class="label">正品提示文案</div>
          <input class="input" name="text_genuine" value="{{ cfg.text_genuine }}" />
        </div>
        <div class="form-row">
          <div class="label">未查到文案</div>
          <input class="input" name="text_not_found" value="{{ cfg.text_not_found }}" />
        </div>
        <div class="form-row">
          <div class="label">警示文案</div>
          <input class="input" name="text_warning" value="{{ cfg.text_warning }}" />
        </div>

        <div class="actions">
          <button class="btn btn-primary" type="submit">保存</button>
          <a class="btn" href="/admin">返回仪表盘</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
