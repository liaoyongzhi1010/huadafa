{% extends "admin/base.html" %}
{% block title %}后台登录{% endblock %}
{% block topbar_title %}后台登录{% endblock %}
{% block body %}
  <div class="container">
    <div class="auth-wrap">
      <div class="card auth-card">
        <div style="font-size:20px; font-weight:900; margin-bottom:6px;">欢迎登录</div>
        <div class="muted" style="font-size:13px;">请输入后台账号密码</div>

        {% if error %}
          <div class="alert alert-danger" style="margin-top:14px;">{{ error }}</div>
        {% endif %}

        <form class="form" method="post" action="/admin/login" style="margin-top:14px;">
          <div class="form-row">
            <div class="label">账号</div>
            <input class="input" name="username" autocomplete="username" />
          </div>
          <div class="form-row">
            <div class="label">密码</div>
            <input class="input" name="password" type="password" autocomplete="current-password" />
          </div>
          <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">登录</button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
