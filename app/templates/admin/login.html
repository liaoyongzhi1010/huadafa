{% extends "base.html" %}
{% block title %}后台登录{% endblock %}
{% block body %}
  <div class="container">
    <div class="card">
      <div class="title center">后台登录</div>
      {% if error %}
        <div class="danger center" style="margin-bottom: 10px;">{{ error }}</div>
      {% endif %}
      <form method="post" action="/admin/login">
        <div style="margin-bottom:10px;">
          <div class="muted">账号</div>
          <input name="username" style="width:100%; padding:10px; border-radius:10px; border:1px solid #e5e7eb;" />
        </div>
        <div style="margin-bottom:14px;">
          <div class="muted">密码</div>
          <input name="password" type="password" style="width:100%; padding:10px; border-radius:10px; border:1px solid #e5e7eb;" />
        </div>
        <button class="btn" type="submit">登录</button>
      </form>
    </div>
  </div>
{% endblock %}
