{% extends "admin/base.html" %}
{% block title %}编辑批次{% endblock %}
{% block topbar_title %}编辑批次{% endblock %}
{% block body %}
  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">编辑批次</h1>
        <div class="muted page-subtitle">产品：{{ product.name }}</div>
      </div>
      <div class="actions">
        <a class="btn btn-ghost" href="/admin/products/{{ product.id }}/batches">返回批次列表</a>
      </div>
    </div>

    <div class="card">
      <form class="form" method="post" action="/admin/batches/{{ batch.id }}/edit">
        {% if error %}
          <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <div class="form-row">
          <div class="label">批次日期</div>
          <input class="input" name="production_date" value="{{ production_date }}" />
          <div class="muted" style="font-size:12px;">支持 `YYYY`、`YYYY-MM`、`YYYY-MM-DD`，例如：2026、2026-03、2026-03-09</div>
        </div>
        <div class="form-row">
          <div class="label">备注</div>
          <input class="input" name="note" placeholder="例如：第一批" value="{{ note or '' }}" />
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="submit">保存修改</button>
          <a class="btn" href="/admin/products/{{ product.id }}/batches">取消</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
