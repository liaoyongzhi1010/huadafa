{% extends "base.html" %}
{% block title %}产品管理{% endblock %}
{% block body %}
  <div class="container">
    <div class="card">
      <div class="title center">产品管理</div>
      <div style="height:10px;"></div>
      <a class="btn" href="/admin/products/new">新增产品</a>
      <div class="hr"></div>
      {% if products and products|length > 0 %}
        {% for p in products %}
          <div style="padding:10px 0; border-bottom:1px solid #f3f4f6;">
            <div style="font-weight:700;">{{ p.name }}</div>
            <div class="muted">ID: {{ p.id }}</div>
          </div>
        {% endfor %}
      {% else %}
        <div class="muted center">暂无产品</div>
      {% endif %}
      <div style="height:12px;"></div>
      <form method="post" action="/admin/logout">
        <button class="btn" type="submit">退出登录</button>
      </form>
    </div>
  </div>
{% endblock %}
