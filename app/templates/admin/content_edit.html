{% extends "admin/base.html" %}
{% block title %}固定内容{% endblock %}
{% block topbar_title %}固定内容{% endblock %}
{% block body %}
  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">固定内容</h1>
        <div class="muted page-subtitle">配置验证页的「品牌溯源 / 关于我们」</div>
      </div>
    </div>

    <div class="card">
      <form class="form" method="post" action="/admin/content">
        <div class="form-row">
          <div class="label">品牌溯源</div>
          <textarea class="textarea" name="brand_text" rows="10">{{ brand_text }}</textarea>
        </div>
        <div class="form-row">
          <div class="label">关于我们</div>
          <textarea class="textarea" name="about_text" rows="10">{{ about_text }}</textarea>
        </div>
        <div class="actions">
          <button class="btn btn-primary" type="submit">保存</button>
          <a class="btn" href="/admin">返回仪表盘</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
